<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>체스 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="top-header">
        <button class="icon-btn" id="btn-sidebar-toggle">☰</button>
        <div class="logo-area">
            <span class="logo-icon">♟️</span>
            <span class="logo-text">체스 게임</span>
        </div>
        <div></div>
    </header>

    <div class="mode-tabs">
        <button class="tab-btn active" data-mode="play">플레이</button>
        <button class="tab-btn" data-mode="puzzle">퍼즐</button>
        <button class="tab-btn" data-mode="coach">코치 대국</button>
    </div>

    <div id="overlay" class="overlay"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">메뉴</div>
        <ul class="sidebar-menu">
            <li data-modal="record"><a href="#">경기 기록</a></li>
            <li data-modal="league"><a href="#">리그</a></li>
            <li data-modal="daily"><a href="#">일일 게임</a></li>
            <li data-modal="lesson"><a href="#">레슨</a></li>
            <li data-modal="puzzle"><a href="#">퍼즐</a></li>
            <li data-modal="review"><a href="#">게임 리뷰</a></li>
        </ul>
    </div>

    <main class="game-area">
        <div id="coach-banner" class="coach-banner">
            <span id="coach-text">코치 매그너스: 중앙을 점령하면서 좋은 기물을 펼쳐보세요!</span>
        </div>

        <div class="player-profile">
            <div class="avatar">👤</div>
            <div class="player-info">
                <span class="player-name" id="opp-name">상대방 (흑색)</span>
            </div>
        </div>

        <div class="board-wrapper">
            <div id="board" class="chess-board"></div>
        </div>

        <div class="player-profile">
            <div class="avatar">♔</div>
            <div class="player-info">
                <span class="player-name">플레이어 (백색)</span>
                <span class="player-status" id="turn-display">백색 차례</span>
            </div>
        </div>
    </main>

    <div class="bottom-controls">
        <button class="btn-reset" id="reset-btn">새 게임 시작</button>
    </div>

    <div id="modal-box" class="modal-box">
        <div class="modal-header">
            <h2 id="modal-title" class="modal-title">메뉴</h2>
        </div>
        <div id="modal-body" class="modal-body">내용</div>
        <button class="btn-reset" id="btn-modal-close" style="margin-top: 15px;">닫기</button>
    </div>

    <script src="rules.js"></script>
    <script src="ui.js"></script>
    <script src="main.js"></script>
</body>
</html>
