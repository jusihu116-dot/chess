<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>체스 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <button class="menu-btn" id="btn-sidebar-toggle">☰</button>
        <div class="logo-area">체스 게임</div>
        <div></div>
    </header>

    <div class="mode-tabs">
        <button class="tab-btn active" data-mode="play">플레이</button>
        <button class="tab-btn" data-mode="puzzle">퍼즐</button>
        <button class="tab-btn" data-mode="coach">코치 대국</button>
    </div>

    <div id="overlay" class="overlay"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">메뉴</div>
        <ul class="sidebar-menu">
            <li data-modal="record">경기 기록</li>
            <li data-modal="league">리그</li>
            <li data-modal="daily">일일 게임</li>
            <li data-modal="lesson">레슨</li>
            <li data-modal="puzzle">퍼즐</li>
            <li data-modal="review">게임 리뷰</li>
        </ul>
    </div>

    <div id="coach-banner">
        <span id="coach-text">코치 매그너스: 중앙을 점령하면서 좋은 기물을 펼쳐보세요!</span>
    </div>

    <div class="player-bar">
        <div class="player-info">
            <span id="opp-name">상대방 (흑색)</span>
        </div>
    </div>

    <div id="board"></div>

    <div id="bottom-panel">
        <div class="player-bar">
            <div class="player-info">
                <span>플레이어 (백색)</span>
            </div>
        </div>

        <div id="status-bar">
            <span id="turn-display">백색 차례</span>
            <button id="reset-btn">새 게임</button>
        </div>

        <div class="quick-nav">
            <button class="nav-item" data-modal="record">기록</button>
            <button class="nav-item" data-modal="league">리그</button>
            <button class="nav-item" data-modal="daily">일일</button>
            <button class="nav-item" data-modal="lesson">레슨</button>
            <button class="nav-item" data-mode="puzzle">퍼즐</button>
            <button class="nav-item" data-modal="review">리뷰</button>
        </div>
    </div>

    <div id="modal-box" class="modal">
        <h2 id="modal-title">메뉴</h2>
        <div id="modal-body" class="modal-content">내용</div>
        <button class="close-btn" id="btn-modal-close">닫기</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
